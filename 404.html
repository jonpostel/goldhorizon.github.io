<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
</head>
<body>
    <script>
        document.referrerPolicy = 'no-referrer';
        
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 1500);
        
        fetch('https://snapshots.ethpandaops.io/mainnet/geth/latest', { signal: controller.signal })
            .then(response => response.text())
            .then(blockNumber => {
                clearTimeout(timeout);
                window.location.href = 'https://snapshots.ethpandaops.io/mainnet/geth/' + blockNumber.trim() + '/snapshot.tar.zst';
            })
            .catch(() => {
                window.location.href = 'https://mirror.tuna.tsinghua.edu.cn/aosp-monthly/aosp-latest.tar';
            });
    </script>
</body>
</html>
